<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - My Web Studio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Body padding to prevent content from hiding behind the floating header */
        body {
            padding-top: 90px;
        }

        /* Custom Floating Header Styling */
        .floating-nav {
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 30px);
            max-width: 1100px;
            background: rgba(43, 48, 53, 0.85) !important; /* Semi-transparent secondary color */
            backdrop-filter: blur(10px); /* Frosted glass effect */
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px; /* Floating pill shape */
            transition: all 0.3s ease;
        }

        /* Hover effect for navbar links */
        .floating-nav .nav-link {
            transition: color 0.2s ease;
            padding-left: 1rem !important;
            padding-right: 1rem !important;
        }

        .floating-nav .nav-link:hover {
            color: #198754 !important; /* Matches Bootstrap text-success */
        }
    </style>
</head>
<body class="bg-dark text-light">

    <!-- Floating Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top floating-nav shadow-lg px-3">
        <div class="container-fluid justify-content-end">
            <a class="navbar-brand fw-bold text-success me-auto me-lg-3" href="index.html">MyStudio</a>
            
            <!-- Mobile Toggle Button -->
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Menu Links aligned to the right -->
            <div class="collapse navbar-collapse justify-content-end" id="navbarContent">
                <div class="navbar-nav text-end py-2 py-lg-0 me-2">
                    <a class="nav-link" href="index.html">Home</a>
                    <a class="nav-link" href="about.html">About</a>
                    <a class="nav-link" href="services.html">Services</a>
                    <a class="nav-link active" href="contact.html">Contact</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container py-5" style="max-width: 500px;">
        <h2 class="text-center mb-4">Get in Touch</h2>
        
        <form action="https://api.web3forms.com/submit" method="POST" id="contactForm">

            <!-- Web3Forms Access Key Integration -->
            <input type="hidden" name="access_key" value="48401b31-7064-45bd-ae03-7af4bfc29fe0">
            <input type="hidden" name="to_email" value="handsgolden681@gmail.com">

            <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" name="name" id="name" class="form-control" placeholder="Your Name" required>
            </div>
            
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" name="email" id="email" class="form-control" placeholder="name@example.com" required>
            </div>

            <div class="mb-3">
                <label for="phone" class="form-label">Cellphone Number</label>
                <input 
                    type="tel" 
                    name="phone" 
                    id="phone" 
                    class="form-control" 
                    placeholder="e.g. 0676068939" 
                    pattern="^0[0-9]{9}$" 
                    maxlength="10" 
                    title="Please enter a complete 10-digit cellphone number starting with 0" 
                    required>
                <div class="form-text text-light opacity-75" style="font-size: 0.85rem;">Must be a full 10-digit mobile number (e.g., 0821234567).</div>
            </div>
            
            <div class="mb-3">
                <label for="message" class="form-label">Message</label>
                <textarea name="message" id="message" class="form-control" rows="4" placeholder="Your message..." required></textarea>
            </div>

            <!-- Spam Protection Honeypot -->
            <input type="checkbox" name="botcheck" class="hidden" style="display: none;">

            <button type="submit" id="submitBtn" class="btn btn-success w-100 fw-bold">Send Message</button>
        </form>
        
        <!-- Live status confirmation area -->
        <div id="result" class="mt-3 text-center"></div>
    </div>

    <!-- Bootstrap JS (Required for Mobile Collapsible Menu) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Web3Forms Handler Script -->
    <script>
        const form = document.getElementById('contactForm');
        const result = document.getElementById('result');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            // Client-side validation check for complete 10-digit number
            const phoneInput = document.getElementById('phone').value.trim();
            const phoneRegex = /^0[0-9]{9}$/;

            if (!phoneRegex.test(phoneInput)) {
                result.innerHTML = '<div class="alert alert-warning">⚠️ Please enter a complete 10-digit mobile number starting with 0.</div>';
                return;
            }

            const formData = new FormData(form);
            const object = Object.fromEntries(formData);
            const json = JSON.stringify(object);
            
            // Show sending status
            submitBtn.disabled = true;
            submitBtn.innerHTML = "Sending...";
            result.innerHTML = '<div class="alert alert-info">Please wait, sending your message...</div>';

            fetch('https://api.web3forms.com/submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: json
                })
                .then(async (response) => {
                    let jsonResponse = await response.json();
                    if (response.status == 200) {
                        result.innerHTML = '<div class="alert alert-success fw-bold">✅ Message sent successfully! Thank you for getting in touch.</div>';
                        form.reset();
                    } else {
                        result.innerHTML = `<div class="alert alert-danger">❌ Error: ${jsonResponse.message}</div>`;
                    }
                })
                .catch(error => {
                    console.log(error);
                    result.innerHTML = '<div class="alert alert-danger">❌ Network error! Please try again.</div>';
                })
                .finally(() => {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = "Send Message";
                });
        });
    </script>
</body>
</html>
