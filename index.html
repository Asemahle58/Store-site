<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - My Web Studio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-secondary shadow">
        <div class="container">
            <a class="navbar-brand fw-bold text-success" href="index.html">MyStudio</a>
            <div class="navbar-nav">
                <a class="nav-link" href="index.html">Home</a>
                <a class="nav-link" href="about.html">About</a>
                <a class="nav-link" href="services.html">Services</a>
                <a class="nav-link active" href="contact.html">Contact</a>
            </div>
        </div>
    </nav>

    <div class="container py-5" style="max-width: 500px;">
        <h2 class="text-center mb-4">Get in Touch</h2>
        <form id="whatsappForm">
            <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" id="name" class="form-control" placeholder="Your Name" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
            </div>
            <div class="mb-3">
                <label for="message" class="form-label">Message</label>
                <textarea id="message" class="form-control" rows="4" placeholder="Your message..." required></textarea>
            </div>
            <button type="button" onclick="sendToWhatsApp()" class="btn btn-success w-100 fw-bold">Send to WhatsApp</button>
        </form>
    </div>

    <script>
        function sendToWhatsApp() {
            // Your South African WhatsApp number formatted with country code 27
            const phoneNumber = "27676068939";

            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const message = document.getElementById('message').value.trim();

            if (!name || !email || !message) {
                alert("Please fill in all fields before sending.");
                return;
            }

            // Construct encoded message layout
            const formattedMessage = `*New Contact Request*%0A%0A` +
                                     `*Name:* ${encodeURIComponent(name)}%0A` +
                                     `*Email:* ${encodeURIComponent(email)}%0A` +
                                     `*Message:* ${encodeURIComponent(message)}`;

            // Create WhatsApp deep-link URL
            const whatsappUrl = `https://wa.me/${phoneNumber}?text=${formattedMessage}`;

            // Open WhatsApp directly in app or browser tab
            window.open(whatsappUrl, '_blank');
        }
    </script>
</body>
</html>
