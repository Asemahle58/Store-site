<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - My Web Studio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-secondary shadow">
        <div class="container">
            <a class="navbar-brand fw-bold text-success" href="index.html">MyStudio</a>
            <div class="navbar-nav">
                <a class="nav-link" href="index.html">Home</a>
                <a class="nav-link" href="about.html">About</a>
                <a class="nav-link" href="services.html">Services</a>
                <a class="nav-link active" href="contact.html">Contact</a>
            </div>
        </div>
    </nav>

    <div class="container py-5" style="max-width: 500px;">
        <h2 class="text-center mb-4">Get in Touch</h2>
        
        <form action="https://api.web3forms.com/submit" method="POST" id="contactForm">

            <!-- PASTE YOUR WEB3FORMS ACCESS KEY HERE -->
            <input type="hidden" name="access_key" value="YOUR_WEB3FORMS_ACCESS_KEY">

            <input type="hidden" name="to_email" value="handsgolden681@gmail.com">

            <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" name="name" id="name" class="form-control" placeholder="Your Name" required>
            </div>
            
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" name="email" id="email" class="form-control" placeholder="name@example.com" required>
            </div>
            
            <div class="mb-3">
                <label for="message" class="form-label">Message</label>
                <textarea name="message" id="message" class="form-control" rows="4" placeholder="Your message..." required></textarea>
            </div>

            <!-- Spam Protection Honeypot -->
            <input type="checkbox" name="botcheck" class="hidden" style="display: none;">

            <button type="submit" id="submitBtn" class="btn btn-success w-100 fw-bold">Send Message</button>
        </form>
        
        <!-- Live status feedback area -->
        <div id="result" class="mt-3 text-center"></div>
    </div>

    <script>
        const form = document.getElementById('contactForm');
        const result = document.getElementById('result');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(form);
            const object = Object.fromEntries(formData);
            const json = JSON.stringify(object);
            
            // Visual feedback while sending
            submitBtn.disabled = true;
            submitBtn.innerHTML = "Sending message...";
            result.innerHTML = '<div class="alert alert-info">Please wait, transmitting your message...</div>';

            fetch('https://api.web3forms.com/submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: json
                })
                .then(async (response) => {
                    let jsonResponse = await response.json();
                    if (response.status == 200) {
                        // Success Confirmation
                        result.innerHTML = '<div class="alert alert-success fw-bold">✅ Success! Your message has been sent to your email.</div>';
                        form.reset();
                    } else {
                        // Error message from API
                        result.innerHTML = `<div class="alert alert-danger">❌ Error: ${jsonResponse.message}</div>`;
                    }
                })
                .catch(error => {
                    console.log(error);
                    result.innerHTML = '<div class="alert alert-danger">❌ Network error! Check your connection and try again.</div>';
                })
                .finally(() => {
                    // Reset button state
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = "Send Message";
                });
        });
    </script>
</body>
</html>
