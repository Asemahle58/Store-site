<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Services - My Web Studio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Body padding to prevent content from hiding behind the floating header */
        body {
            padding-top: 90px;
        }

        /* Custom Floating Header Styling */
        .floating-nav {
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 30px);
            max-width: 1100px;
            background: rgba(43, 48, 53, 0.85) !important; /* Semi-transparent secondary color */
            backdrop-filter: blur(10px); /* Frosted glass effect */
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px; /* Floating pill shape */
            transition: all 0.3s ease;
        }

        /* Hover effect for navbar links */
        .floating-nav .nav-link {
            transition: color 0.2s ease;
            padding-left: 1rem !important;
            padding-right: 1rem !important;
        }

        .floating-nav .nav-link:hover {
            color: #198754 !important; /* Matches Bootstrap text-success */
        }
    </style>
</head>
<body class="bg-dark text-light">

    <!-- Floating Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top floating-nav shadow-lg px-3">
        <div class="container-fluid justify-content-end">
            <a class="navbar-brand fw-bold text-success me-auto me-lg-3" href="index.html">MyStudio</a>
            
            <!-- Mobile Toggle Button -->
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Menu Links aligned to the right -->
            <div class="collapse navbar-collapse justify-content-end" id="navbarContent">
                <div class="navbar-nav text-end py-2 py-lg-0 me-2">
                    <a class="nav-link" href="index.html">Home</a>
                    <a class="nav-link" href="about.html">About</a>
                    <a class="nav-link active" href="services.html">Services</a>
                    <a class="nav-link" href="contact.html">Contact</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container py-5">
        <h2 class="text-center mb-4">Our Services</h2>
        <div class="row g-4 text-dark">
            <div class="col-md-6">
                <div class="card p-3 shadow">
                    <h3>Web Development</h3>
                    <p>Custom full-stack web application development.</p>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card p-3 shadow">
                    <h3>Tech Support & Repair</h3>
                    <p>Hardware diagnostics, system configuration, and software setup.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS (Required for Mobile Collapsible Menu) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
